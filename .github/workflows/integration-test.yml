name: Integration Tests

on:
  workflow_dispatch:  # Manual trigger
  push:
    branches:
      - main
      - 2025-updates

permissions:
  id-token: write   # Required for OIDC
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'
          cache: 'maven'

      - name: Set up SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::397589511426:role/account-wide-resources-GithubActionsRole-1CAIKQPYM5WD3
          aws-region: ${{ env.AWS_REGION }}

      - name: Make scripts executable
        run: |
          chmod +x test-harness/**/*.sh

      - name: Deploy all stacks
        id: deploy
        run: |
          ./test-harness/deploy/deploy-all.sh

      - name: Run smoke tests
        id: test
        run: |
          ./test-harness/test/test-all.sh

      - name: Teardown all stacks
        if: always()
        run: |
          ./test-harness/teardown/teardown-all.sh
